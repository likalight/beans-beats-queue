# Render's free plan sleeps after 15 minutes without traffic and takes ~50 s to
# wake. This pings the health endpoint every 10 minutes so the booth tablets
# and guest pages never hit a cold start. Set the LIVE_URL repository variable
# (Settings > Secrets and variables > Actions > Variables) to change the target.
name: Keep alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          LIVE_URL: ${{ vars.LIVE_URL || 'https://beans-beats-queue.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            if out=$(curl -fsS --max-time 60 "$LIVE_URL/api/health"); then echo "$out"; exit 0; fi
            echo "attempt $i failed, retrying"; sleep 10
          done
          exit 1
